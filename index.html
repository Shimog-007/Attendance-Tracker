<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .controls {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            padding: 20px;
            background: #f8f9fa;
            border-bottom: 1px solid #e0e0e0;
            align-items: center;
        }

        .filter-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .filter-group label {
            font-weight: 600;
            color: #333;
        }

        .filter-group select {
            padding: 8px 12px;
            border: 2px solid #667eea;
            border-radius: 5px;
            font-size: 0.95em;
            cursor: pointer;
            background: white;
        }

        .filter-group select:focus {
            outline: none;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.5);
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-left: auto;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-size: 0.95em;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-reset {
            background: #ff6b6b;
            color: white;
        }

        .btn-reset:hover {
            background: #ee5a52;
            transform: translateY(-2px);
        }

        .dashboard {
            padding: 30px;
            background: white;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .stat-card h3 {
            font-size: 0.95em;
            opacity: 0.9;
            margin-bottom: 10px;
        }

        .stat-value {
            font-size: 2.5em;
            font-weight: bold;
        }

        .stat-card.alert {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a52 100%);
        }

        .attendance-section {
            margin-top: 30px;
        }

        .attendance-section h2 {
            font-size: 1.8em;
            margin-bottom: 20px;
            color: #333;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }

        .day-card {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        .day-card:hover {
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transform: translateY(-2px);
        }

        .day-header {
            font-size: 1.3em;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }

        .session {
            margin-bottom: 15px;
            padding: 12px;
            background: #f8f9fa;
            border-radius: 5px;
            border-left: 4px solid #667eea;
        }

        .session-time {
            font-size: 0.85em;
            color: #666;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .session-subject {
            font-size: 0.95em;
            color: #333;
            margin-bottom: 8px;
        }

        .session-instructor {
            font-size: 0.8em;
            color: #888;
            margin-bottom: 10px;
        }

        .status-selector {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .status-btn {
            padding: 6px 12px;
            border: 2px solid #ddd;
            background: white;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85em;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .status-btn:hover {
            transform: scale(1.05);
        }

        .status-btn.present {
            background: #4caf50;
            color: white;
            border-color: #4caf50;
        }

        .status-btn.absent {
            background: #ff6b6b;
            color: white;
            border-color: #ff6b6b;
        }

        .status-btn.cancelled {
            background: #9e9e9e;
            color: white;
            border-color: #9e9e9e;
        }

        .session.status-present {
            background: #e8f5e9;
            border-left-color: #4caf50;
        }

        .session.status-absent {
            background: #ffebee;
            border-left-color: #ff6b6b;
        }

        .session.status-cancelled {
            background: #f5f5f5;
            border-left-color: #9e9e9e;
        }

        .subject-stats {
            margin-top: 40px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .subject-stats h3 {
            font-size: 1.5em;
            margin-bottom: 20px;
            color: #333;
        }

        .subject-stat-item {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            padding: 15px;
            background: white;
            border-radius: 5px;
            border-left: 4px solid #667eea;
        }

        .subject-name {
            flex: 1;
            font-weight: 600;
            color: #333;
        }

        .subject-percentage {
            font-size: 1.3em;
            font-weight: bold;
            min-width: 80px;
            text-align: right;
        }

        .subject-percentage.alert {
            color: #ff6b6b;
        }

        .no-data {
            text-align: center;
            padding: 40px;
            color: #999;
            font-size: 1.1em;
        }

        @media (max-width: 768px) {
            .controls {
                flex-direction: column;
                align-items: stretch;
            }

            .filter-group {
                flex-direction: column;
                align-items: stretch;
            }

            .action-buttons {
                margin-left: 0;
            }

            .calendar-grid {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📅 Attendance Tracker</h1>
            <p>June 29, 2026 - November 29, 2026</p>
        </div>

        <div class="controls">
            <div class="filter-group">
                <label for="monthFilter">Month:</label>
                <select id="monthFilter">
                    <option value="">All Months</option>
                    <option value="6">June 2026</option>
                    <option value="7">July 2026</option>
                    <option value="8">August 2026</option>
                    <option value="9">September 2026</option>
                    <option value="10">October 2026</option>
                    <option value="11">November 2026</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="subjectFilter">Subject:</label>
                <select id="subjectFilter">
                    <option value="">All Subjects</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="dayFilter">Day:</label>
                <select id="dayFilter">
                    <option value="">All Days</option>
                    <option value="1">Monday</option>
                    <option value="2">Tuesday</option>
                    <option value="3">Wednesday</option>
                    <option value="4">Thursday</option>
                    <option value="5">Friday</option>
                    <option value="6">Saturday</option>
                </select>
            </div>

            <div class="action-buttons">
                <button class="btn btn-reset" onclick="resetAllData()">Reset Data</button>
            </div>
        </div>

        <div class="dashboard">
            <div class="stats-grid" id="statsGrid">
                <div class="stat-card">
                    <h3>Overall Attendance</h3>
                    <div class="stat-value" id="overallAttendance">0%</div>
                </div>
            </div>

            <div class="attendance-section">
                <h2>Daily Attendance</h2>
                <div class="calendar-grid" id="calendarGrid">
                    <!-- Generated by JavaScript -->
                </div>
            </div>

            <div class="subject-stats">
                <h3>Subject-wise Attendance</h3>
                <div id="subjectStatsContainer">
                    <!-- Generated by JavaScript -->
                </div>
            </div>
        </div>
    </div>

    <script>
        const TIMETABLE = {
            1: [ // Monday
                { time: '09:30 - 10:30', subject: 'OS', instructor: 'Ms. Shravya S' },
                { time: '10:30 - 11:25', subject: 'PP', instructor: 'Ms. Pooja' },
                { time: '11:35 - 12:30', subject: 'DS Lab - in Class', instructor: 'Ms. Sushma' },
                { time: '12:30 - 01:30', subject: 'DS Lab - in Class', instructor: 'Ms. Sushma' },
                { time: '02:30 - 03:30', subject: 'Crypto', instructor: 'Ms. Manjula' }
            ],
            2: [ // Tuesday
                { time: '09:30 - 10:30', subject: 'Crypto', instructor: 'Ms. Manjula' },
                { time: '10:30 - 11:25', subject: 'DS', instructor: 'Ms. Sushma' },
                { time: '11:35 - 12:30', subject: 'PP', instructor: 'Ms. Pooja' },
                { time: '12:30 - 01:30', subject: 'VAC', instructor: 'Ms. Greeshma' },
                { time: '02:30 - 03:30', subject: 'OS', instructor: 'Ms. Shravya S' }
            ],
            3: [ // Wednesday
                { time: '09:30 - 10:30', subject: 'PP Lab - 7th Floor Lab', instructor: 'Ms. Pooja' },
                { time: '10:30 - 11:25', subject: 'PP Lab - 7th Floor Lab', instructor: 'Ms. Pooja' },
                { time: '11:35 - 12:30', subject: 'SEC', instructor: 'Mr. Arun Kumar' },
                { time: '12:30 - 01:30', subject: 'DS', instructor: 'Ms. Sushma' },
                { time: '02:30 - 03:30', subject: 'BCA ME Group 3', instructor: '' }
            ],
            4: [ // Thursday
                { time: '09:30 - 10:30', subject: 'OS', instructor: 'Ms. Shravya S' },
                { time: '10:30 - 11:25', subject: 'Crypto', instructor: 'Ms. Manjula' },
                { time: '11:35 - 12:30', subject: 'SEC', instructor: 'Mr. Arun Kumar' },
                { time: '01:30 - 02:30', subject: 'DS Lab - 7th Floor Lab', instructor: 'Ms. Sushma' },
                { time: '02:30 - 03:30', subject: 'DS Lab - 7th Floor Lab', instructor: 'Ms. Sushma' }
            ],
            5: [ // Friday
                { time: '09:30 - 10:25', subject: 'PP', instructor: 'Ms. Pooja' },
                { time: '10:25 - 11:20', subject: 'DS', instructor: 'Ms. Sushma' },
                { time: '11:30 - 12:20', subject: 'BCA ME Group 3', instructor: '' },
                { time: '02:00 - 02:45', subject: 'VAC', instructor: 'Ms. Greeshma' },
                { time: '02:45 - 04:30', subject: 'Crypto_IBM', instructor: '' }
            ],
            6: [ // Saturday
                { time: '09:30 - 10:25', subject: 'PP Lab - in Class', instructor: 'Ms. Pooja' },
                { time: '10:25 - 11:20', subject: 'PP Lab - in Class', instructor: 'Ms. Pooja' },
                { time: '11:30 - 12:20', subject: 'OS', instructor: 'Ms. Shravya S' },
                { time: '01:30 - 02:30', subject: 'Crypto', instructor: 'Ms. Manjula' },
                { time: '02:30 - 03:30', subject: 'SEC', instructor: 'Mr. Arun Kumar' }
            ]
        };

        const DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
        const START_DATE = new Date(2026, 5, 29); // June 29, 2026
        const END_DATE = new Date(2026, 10, 29); // November 29, 2026

        let attendanceData = {};
        let allDates = [];

        function initializeApp() {
            loadAttendanceData();
            generateAllDates();
            populateSubjectFilter();
            renderCalendar();
            updateStats();
            setupEventListeners();
        }

        function generateAllDates() {
            allDates = [];
            let currentDate = new Date(START_DATE);
            
            while (currentDate <= END_DATE) {
                const dayOfWeek = currentDate.getDay();
                if (dayOfWeek !== 0) { // Exclude Sundays
                    allDates.push(new Date(currentDate));
                }
                currentDate.setDate(currentDate.getDate() + 1);
            }
        }

        function getDateKey(date) {
            return date.toISOString().split('T')[0];
        }

        function initializeAttendanceData(dateKey, dayOfWeek) {
            if (!attendanceData[dateKey]) {
                attendanceData[dateKey] = {};
                TIMETABLE[dayOfWeek].forEach((session, index) => {
                    attendanceData[dateKey][index] = 'not-marked';
                });
            }
        }

        function saveAttendanceData() {
            localStorage.setItem('attendanceData', JSON.stringify(attendanceData));
        }

        function loadAttendanceData() {
            const data = localStorage.getItem('attendanceData');
            attendanceData = data ? JSON.parse(data) : {};
        }

        function populateSubjectFilter() {
            const subjects = new Set();
            Object.values(TIMETABLE).forEach(day => {
                day.forEach(session => {
                    if (session.subject) {
                        subjects.add(session.subject);
                    }
                });
            });

            const subjectFilter = document.getElementById('subjectFilter');
            Array.from(subjects).sort().forEach(subject => {
                const option = document.createElement('option');
                option.value = subject;
                option.textContent = subject;
                subjectFilter.appendChild(option);
            });
        }

        function renderCalendar() {
            const monthFilter = document.getElementById('monthFilter').value;
            const subjectFilter = document.getElementById('subjectFilter').value;
            const dayFilter = document.getElementById('dayFilter').value;

            const calendarGrid = document.getElementById('calendarGrid');
            calendarGrid.innerHTML = '';

            const filteredDates = allDates.filter(date => {
                const month = date.getMonth() + 1;
                const dayOfWeek = date.getDay();
                
                let matches = true;

                if (monthFilter && month !== parseInt(monthFilter)) {
                    matches = false;
                }

                if (dayFilter && dayOfWeek !== parseInt(dayFilter)) {
                    matches = false;
                }

                if (subjectFilter && !hasSubjectOnDay(dayOfWeek, subjectFilter)) {
                    matches = false;
                }

                return matches;
            });

            if (filteredDates.length === 0) {
                calendarGrid.innerHTML = '<div class="no-data">No attendance records match the selected filters.</div>';
                return;
            }

            filteredDates.forEach(date => {
                const dayCard = createDayCard(date);
                calendarGrid.appendChild(dayCard);
            });
        }

        function hasSubjectOnDay(dayOfWeek, subject) {
            return TIMETABLE[dayOfWeek].some(session => session.subject === subject);
        }

        function createDayCard(date) {
            const dayOfWeek = date.getDay();
            const dateKey = getDateKey(date);
            
            initializeAttendanceData(dateKey, dayOfWeek);

            const card = document.createElement('div');
            card.className = 'day-card';

            const dateString = date.toLocaleDateString('en-US', { 
                weekday: 'long', 
                year: 'numeric', 
                month: 'short', 
                day: 'numeric' 
            });

            card.innerHTML = `<div class="day-header">${dateString}</div>`;

            const sessions = TIMETABLE[dayOfWeek];
            
            sessions.forEach((session, index) => {
                const status = attendanceData[dateKey][index];
                const sessionDiv = document.createElement('div');
                sessionDiv.className = `session status-${status}`;

                sessionDiv.innerHTML = `
                    <div class="session-time">${session.time}</div>
                    <div class="session-subject">${session.subject}</div>
                    ${session.instructor ? `<div class="session-instructor">${session.instructor}</div>` : ''}
                    <div class="status-selector">
                        <button class="status-btn ${status === 'present' ? 'present' : ''}" onclick="updateAttendance('${dateKey}', ${index}, 'present')">Present</button>
                        <button class="status-btn ${status === 'absent' ? 'absent' : ''}" onclick="updateAttendance('${dateKey}', ${index}, 'absent')">Absent</button>
                        <button class="status-btn ${status === 'cancelled' ? 'cancelled' : ''}" onclick="updateAttendance('${dateKey}', ${index}, 'cancelled')">Cancelled</button>
                    </div>
                `;

                card.appendChild(sessionDiv);
            });

            return card;
        }

        function updateAttendance(dateKey, sessionIndex, status) {
            attendanceData[dateKey][sessionIndex] = status;
            saveAttendanceData();
            renderCalendar();
            updateStats();
        }

        function updateStats() {
            updateOverallAttendance();
            updateSubjectStats();
        }

        function updateOverallAttendance() {
            let totalSessions = 0;
            let presentSessions = 0;

            Object.values(attendanceData).forEach(day => {
                Object.values(day).forEach(status => {
                    if (status !== 'not-marked') {
                        totalSessions++;
                        if (status === 'present') {
                            presentSessions++;
                        }
                    }
                });
            });

            const percentage = totalSessions > 0 ? Math.round((presentSessions / totalSessions) * 100) : 0;
            document.getElementById('overallAttendance').textContent = `${percentage}%`;
        }

        function updateSubjectStats() {
            const subjectStats = {};

            // Initialize all subjects
            Object.values(TIMETABLE).forEach(day => {
                day.forEach(session => {
                    if (session.subject && !subjectStats[session.subject]) {
                        subjectStats[session.subject] = { present: 0, total: 0 };
                    }
                });
            });

            // Count attendance
            allDates.forEach(date => {
                const dateKey = getDateKey(date);
                const dayOfWeek = date.getDay();

                TIMETABLE[dayOfWeek].forEach((session, index) => {
                    const status = attendanceData[dateKey]?.[index];
                    if (status && status !== 'not-marked' && status !== 'cancelled') {
                        subjectStats[session.subject].total++;
                        if (status === 'present') {
                            subjectStats[session.subject].present++;
                        }
                    }
                });
            });

            // Render subject stats
            const container = document.getElementById('subjectStatsContainer');
            container.innerHTML = '';

            Object.entries(subjectStats).sort((a, b) => a[0].localeCompare(b[0])).forEach(([subject, stats]) => {
                const percentage = stats.total > 0 ? Math.round((stats.present / stats.total) * 100) : 0;
                const isAlert = percentage > 0 && percentage < 75;

                const item = document.createElement('div');
                item.className = 'subject-stat-item';
                item.innerHTML = `
                    <div class="subject-name">${subject}</div>
                    <div class="subject-percentage ${isAlert ? 'alert' : ''}">${percentage}%</div>
                `;
                container.appendChild(item);
            });
        }

        function setupEventListeners() {
            document.getElementById('monthFilter').addEventListener('change', renderCalendar);
            document.getElementById('subjectFilter').addEventListener('change', renderCalendar);
            document.getElementById('dayFilter').addEventListener('change', renderCalendar);
        }

        function resetAllData() {
            if (confirm('Are you sure you want to reset all attendance data? This action cannot be undone.')) {
                localStorage.removeItem('attendanceData');
                attendanceData = {};
                renderCalendar();
                updateStats();
            }
        }

        // Initialize on page load
        window.addEventListener('DOMContentLoaded', initializeApp);
    </script>
</body>
</html>
